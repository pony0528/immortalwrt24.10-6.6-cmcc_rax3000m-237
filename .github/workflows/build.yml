name: Build ImmortalWrt RAX3000M with StrongSwan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3-pyelftools

      - name: Clone ImmortalWrt source
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Import custom config
        run: |
          cd openwrt
          curl -L -o .config https://raw.githubusercontent.com/jiehuihui/immortalwrt-cmcc_rax3000m-237/main/.config
          echo "CONFIG_PACKAGE_luci-app-strongswan=y" >> .config
          make defconfig

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) download V=s
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v3
        with:
          name: RAX3000M-Firmware
          path: openwrt/bin/targets/*
